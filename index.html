<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#16151A">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<title>Spud — Project OS</title>
<script src="firebase-bundle.js"></script>
<style>
  :root{
    --bg:#16151A;
    --panel:#1F1E25;
    --panel-2:#26252D;
    --line:#34333C;
    --text:#EDEAE4;
    --text-dim:#9C99A8;
    --text-faint:#6B697A;
    --client:#FF8A5C;
    --own:#9B8CFF;
    --biz:#4ABDAC;
    --warn:#FFC857;
    --radius:14px;
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  body{
    font-family:'Segoe UI', system-ui, -apple-system, sans-serif;
    background:var(--bg);
    color:var(--text);
    padding:24px 16px 60px;
    max-width:760px;
    margin:0 auto;
    -webkit-font-smoothing:antialiased;
  }
  
  /* Main View Navigation Tabs */
  .view-nav {
    display: flex; gap: 8px; margin-bottom: 24px;
    border-bottom: 1px solid var(--line); padding-bottom: 14px;
  }
  .nav-btn {
    flex: 1; padding: 12px; border: 1px solid var(--line); border-radius: 10px;
    background: var(--panel-2); color: var(--text-dim); font-size: 13px;
    font-weight: 700; cursor: pointer; transition: all .15s;
    display: flex; align-items: center; justify-content: center; gap: 6px;
  }
  .nav-btn.active { background: var(--text); color: var(--bg); border-color: var(--text); }
  .nav-btn .badge { background: var(--client); color: #fff; font-size: 10px; padding: 2px 6px; border-radius: 20px; }

  .top{ display:flex; justify-content:space-between; align-items:flex-end; margin-bottom:22px; }
  .top h1{ font-size:22px; font-weight:700; letter-spacing:-0.02em; }
  .top .sub{ color:var(--text-dim); font-size:13px; margin-top:2px; }
  .top .date{ color:var(--text-faint); font-size:12px; text-align:right; }

  .nudge{
    background:linear-gradient(135deg, rgba(255,200,87,0.12), rgba(255,200,87,0.04));
    border:1px solid rgba(255,200,87,0.25); border-radius:var(--radius);
    padding:12px 16px; font-size:13px; color:#FFE0A3; margin-bottom:20px;
    display:flex; gap:10px; align-items:flex-start;
  }
  .nudge .ico{ font-size:15px; line-height:1.3; }

  .label{
    font-size:11px; font-weight:700; text-transform:uppercase;
    letter-spacing:0.12em; color:var(--text-faint); margin:24px 0 10px;
  }
  .label:first-of-type{ margin-top:0; }

  .week{ display:flex; gap:6px; margin-bottom:4px; }
  .week .day{ flex:1; text-align:center; }
  .week .dlabel{ font-size:10px; color:var(--text-faint); text-transform:uppercase; margin-bottom:5px; }
  .week .dbar{ height:34px; border-radius:6px; background:var(--panel-2); position:relative; overflow:hidden; border:1px solid var(--line); }
  .week .dbar.today{ border-color:var(--own); }
  .week .dfill{ position:absolute; bottom:0; left:0; right:0; border-radius:0 0 6px 6px; }

  .projects{ display:flex; flex-direction:column; gap:8px; }
  .pcard{
    background:var(--panel); border:1px solid var(--line); border-radius:var(--radius);
    padding:14px 16px; cursor:pointer; transition:border-color .15s, transform .1s;
  }
  .pcard:active{ transform:scale(0.997); }
  .pcard:hover{ border-color:#454351; }
  .prow1{ display:flex; justify-content:space-between; align-items:flex-start; gap:10px; margin-bottom:8px; }
  .pname{ font-size:14px; font-weight:600; }
  .pmeta{ font-size:11px; color:var(--text-faint); margin-top:2px; }
  .ptag{ font-size:10px; font-weight:700; padding:3px 8px; border-radius:20px; white-space:nowrap; text-transform:uppercase; letter-spacing:0.05em; }
  .ptag.client{ background:rgba(255,138,92,0.15); color:var(--client); }
  .ptag.own{ background:rgba(155,140,255,0.15); color:var(--own); }
  .ptag.biz{ background:rgba(74,189,172,0.15); color:var(--biz); }
  .pcard.p1{ border-color:var(--client); box-shadow:0 0 0 1px rgba(255,138,92,0.15); }
  .prio{ font-size:10px; font-weight:800; letter-spacing:0.08em; color:var(--text-faint); margin-bottom:6px; text-transform:uppercase; }
  .prio.p1{ color:var(--client); }
  .prio.p2{ color:var(--own); }

  .pbar-bg{ height:5px; background:var(--panel-2); border-radius:3px; overflow:hidden; margin-bottom:6px; }
  .pbar-fill{ height:100%; border-radius:3px; transition:width .3s; }
  .pfoot{ display:flex; justify-content:space-between; font-size:11px; color:var(--text-dim); }

  .tasks{ display:flex; flex-direction:column; gap:0; background:var(--panel); border:1px solid var(--line); border-radius:var(--radius); overflow:hidden; }
  .task{ display:flex; align-items:center; gap:12px; padding:12px 16px; border-bottom:1px solid var(--line); cursor:pointer; }
  .task:last-child{ border-bottom:none; }
  .task:hover{ background:var(--panel-2); }
  .tcheck{ width:18px; height:18px; border-radius:5px; border:1.5px solid var(--text-faint); flex-shrink:0; display:flex; align-items:center; justify-content:center; transition:all .15s; }
  .tcheck.done{ background:var(--own); border-color:var(--own); }
  .tcheck.done::after{ content:"✓"; color:#16151A; font-size:11px; font-weight:900; }
  .ttext{ font-size:13px; flex:1; }
  .ttext.done{ text-decoration:line-through; color:var(--text-faint); }
  .tfreq{ font-size:11px; color:var(--text-faint); white-space:nowrap; }

  /* Pinterest Masonry Layout */
  .masonry-grid {
    column-count: 2; column-gap: 12px; width: 100%;
  }
  @media (max-width: 500px) { .masonry-grid { column-count: 1; } }
  .masonry-item {
    break-inside: avoid; background: var(--panel); border: 1px solid var(--line);
    border-radius: var(--radius); padding: 12px; margin-bottom: 12px; display: flex; flex-direction: column; gap: 8px;
  }
  .masonry-item img { width: 100%; border-radius: 8px; object-fit: cover; display: block; border: 1px solid rgba(255,255,255,0.05); }
  .masonry-meta { display: flex; justify-content: space-between; align-items: center; font-size: 11px; }

  /* Forms & Sub-elements */
  .cal-list{ background:var(--panel); border:1px solid var(--line); border-radius:var(--radius); padding:6px 16px; }
  .citem{ display:flex; gap:10px; padding:10px 0; border-bottom:1px solid var(--line); align-items:flex-start; }
  .citem:last-child{ border-bottom:none; }
  .cdot{ width:8px; height:8px; border-radius:50%; margin-top:5px; flex-shrink:0; }
  .ctitle{ font-size:13px; }
  .ctime{ font-size:11px; color:var(--text-faint); margin-top:1px; }
  .cempty{ padding:14px 0; font-size:13px; color:var(--text-dim); }

  .chat{ border:1px solid var(--line); border-radius:var(--radius); overflow:hidden; background:var(--panel); }
  .messages{ max-height:280px; overflow-y:auto; padding:14px 16px; display:flex; flex-direction:column; gap:8px; min-height:80px; }
  .msg{ max-width:85%; padding:9px 13px; border-radius:14px; font-size:13px; line-height:1.5; }
  .msg.assistant{ background:var(--panel-2); align-self:flex-start; border-bottom-left-radius:4px; }
  .msg.user{ background:var(--own); color:#16151A; align-self:flex-end; border-bottom-right-radius:4px; font-weight:500; }
  .msg.loading{ color:var(--text-faint); font-style:italic; }
  .input-row{ display:flex; border-top:1px solid var(--line); }
  .input-row input{ flex:1; border:none; background:transparent; padding:13px 16px; font-size:13px; color:var(--text); outline:none; font-family:inherit; }
  .input-row input::placeholder{ color:var(--text-faint); }
  .input-row button{ padding:0 18px; border:none; border-left:1px solid var(--line); background:transparent; color:var(--own); font-weight:700; font-size:13px; cursor:pointer; }
  .input-row button:hover{ background:var(--panel-2); }
  .input-row button:disabled{ opacity:0.4; cursor:default; }
  .mic-btn{ border-left:1px solid var(--line); background:transparent; border:none; border-right:1px solid var(--line); width:44px; flex-shrink:0; cursor:pointer; font-size:16px; display:flex; align-items:center; justify-content:center; color:var(--text-dim); transition:color .15s, background .15s; }
  .mic-btn:hover{ background:var(--panel-2); color:var(--text); }
  .mic-btn.listening{ color:#FF8A5C; animation:pulse 1s infinite; }
  @keyframes pulse{ 0%,100%{ opacity:1; } 50%{ opacity:0.4; } }

  ::-webkit-scrollbar{ width:6px; }
  ::-webkit-scrollbar-thumb{ background:var(--line); border-radius:3px; }
  .tab-btn{ flex:1; padding:8px 6px; border:1px solid var(--line); border-radius:8px; background:var(--panel-2); color:var(--text-dim); font-size:12px; font-weight:600; cursor:pointer; transition:all .15s; }
  .tab-btn.active{ background:var(--own); color:#16151A; border-color:var(--own); }
  .hour-chip{ padding:6px 12px; border-radius:20px; border:1px solid var(--line); background:var(--panel-2); color:var(--text-dim); font-size:13px; font-weight:600; cursor:pointer; transition:all .15s; }
  .hour-chip.active{ background:var(--own); color:#16151A; border-color:var(--own); }
  .prio-chip{ padding:6px 12px; border-radius:20px; border:1px solid var(--line); background:var(--panel-2); color:var(--text-dim); font-size:12px; font-weight:600; cursor:pointer; transition:all .15s; white-space:nowrap; }
  .prio-chip.active{ background:var(--panel); color:var(--text); border-color:var(--own); }
  .action-btn{ width:100%; padding:12px; border:none; border-radius:10px; background:var(--own); color:#16151A; font-size:14px; font-weight:700; cursor:pointer; transition:opacity .15s; }
  .action-btn:active{ opacity:0.8; }
  .panel{ background:var(--panel); border:1px solid var(--line); border-radius:var(--radius); padding:14px 16px; margin-bottom:0; }

  .schedule{ display:flex; flex-direction:column; gap:8px; }
  .sblock{ background:var(--panel); border:1px solid var(--line); border-radius:var(--radius); padding:12px 16px; }
  .sblock.optional{ border-style:dashed; opacity:0.85; }
  .srow1{ display:flex; justify-content:space-between; align-items:baseline; margin-bottom:8px; }
  .slabel{ font-size:13px; font-weight:700; }
  .stime{ font-size:11px; color:var(--text-faint); }
  .sassigns{ display:flex; flex-direction:column; gap:5px; }
  .sassign{ display:flex; align-items:center; gap:8px; font-size:12px; }
  .sdot{ width:8px; height:8px; border-radius:50%; flex-shrink:0; }
  .shrs{ margin-left:auto; color:var(--text-faint); font-size:11px; }
  .sempty{ font-size:12px; color:var(--text-faint); font-style:italic; }
  .sopt-tag{ font-size:10px; color:var(--text-faint); text-transform:
